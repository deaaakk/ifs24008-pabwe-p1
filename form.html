<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form Pendaftaran Akun Baru">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <header>
        <nav aria-label="Navigasi Utama">
            <p>
                <strong>Navigasi:</strong>&nbsp;
                <a href="index.html">IMDb Movies</a>&nbsp;|&nbsp;
                <a href="blog.html">Dev Blogs</a>&nbsp;|&nbsp;
                <a href="form.html">Form Pendaftaran</a>&nbsp;|&nbsp;
                <a href="cv.html">Curriculum Vitae</a>
            </p>
        </nav>
        <hr>
    </header>

    <main>
        <h1 hidden>Form Pendaftaran Akun</h1>

        <form action="#" method="post">
            <fieldset>
                <legend>Daftar Akun</legend>

                <table role="presentation">
                    <tr>
                        <td><label for="nama">Nama Lengkap</label></td>
                        <td>:</td>
                        <td><input type="text" id="nama" name="nama" required></td>
                    </tr>
                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>:</td>
                        <td>
                            <input type="radio" id="laki" name="gender" value="Laki-laki" required>
                            <label for="laki">Laki-laki</label>
                            <input type="radio" id="perempuan" name="gender" value="Perempuan">
                            <label for="perempuan">Perempuan</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="tempat_lahir">Tempat Lahir</label></td>
                        <td>:</td>
                        <td><input type="text" id="tempat_lahir" name="tempat_lahir" required></td>
                    </tr>
                    <tr>
                        <td><label for="tanggal_lahir">Tanggal Lahir</label></td>
                        <td>:</td>
                        <td><input type="date" id="tanggal_lahir" name="tanggal_lahir" required></td>
                    </tr>
                    <tr>
                        <td><label for="agama">Agama</label></td>
                        <td>:</td>
                        <td>
                            <select id="agama" name="agama" required>
                                <option value="Islam">Islam</option>
                                <option value="Katolik">Katolik</option>
                                <option value="Protestan">Protestan</option>
                                <option value="Hindu">Hindu</option>
                                <option value="Buddha">Buddha</option>
                                <option value="Konghucu">Konghucu</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td valign="top">Hobi</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="checkbox" id="membaca" name="hobi" value="Membaca">
                            <label for="membaca">Membaca</label><br>
                            <input type="checkbox" id="menulis" name="hobi" value="Menulis">
                            <label for="menulis">Menulis</label><br>
                            <input type="checkbox" id="coding" name="hobi" value="Coding">
                            <label for="coding">Coding</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="password">Password</label></td>
                        <td>:</td>
                        <td><input type="password" id="password" name="password" required></td>
                    </tr>
                    <tr>
                        <td colspan="3">
                            <input type="checkbox" id="persetujuan" name="persetujuan" required>
                            <label for="persetujuan">Saya menyetujui syarat dan ketentuan yang berlaku</label>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="3">
                            <input type="reset" value="Reset">
                            <input type="submit" value="Submit">
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </main>
</body>
</html>
